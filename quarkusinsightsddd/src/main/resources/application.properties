quarkus.application.name=quarkusinsightsddd
quarkus.http.port=8080
quarkus.banner.enabled=false

# Domain layers must compile and test as POJOs without booting Quarkus.
# Tests under <context>/domain/ are pure JUnit; only adapter and end-to-end
# tests use @QuarkusTest.

# Hibernate ORM: update schema in dev, drop-and-create in test, none in prod.
%dev.quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=none

# Log SQL during dev for the live-coding refactor demo.
%dev.quarkus.hibernate-orm.log.sql=true

# Qute: tolerate missing data keys in templates. The admin pages have
# many optional flags (error, message, picker mode, etc.); a missing
# key should evaluate to a falsy value rather than throw.
quarkus.qute.strict-rendering=false
