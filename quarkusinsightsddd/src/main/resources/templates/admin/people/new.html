{#include admin/layout}
{#title}Register person · Admin · Quarkus Insights{/title}
{#content}
  <h2><a href="/admin/people">← Back</a> · Register a new person</h2>

  {#if error}<div class="error">{error}</div>{/if}

  <form method="post" action="/admin/people/new">
    <label for="firstName">First name</label>
    <input type="text" id="firstName" name="firstName" value="{firstName ?: ''}" required maxlength="100">

    <label for="lastName">Last name</label>
    <input type="text" id="lastName" name="lastName" value="{lastName ?: ''}" required maxlength="100">

    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{email ?: ''}" required maxlength="320">

    <label for="bio">Biography (50–2000 chars)</label>
    <textarea id="bio" name="bio" required minlength="50" maxlength="2000">{bio ?: ''}</textarea>

    <div style="margin-top: 1rem;">
      <button type="submit">Register</button>
      <a href="/admin/people"><button type="button" class="secondary">Cancel</button></a>
    </div>
  </form>
{/content}
{/include}
